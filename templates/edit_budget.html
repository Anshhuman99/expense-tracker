{% extends "base.html" %}

{% block title %}Edit Budget — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/budgets.css') }}">
{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Edit Budget</h1>
            <p class="auth-subtitle">Update your spending limit for this category</p>
        </div>

        <div class="auth-card">
            <form method="POST" action="{{ url_for('edit_budget', id=budget.id) }}" id="edit-budget-form">

                <div class="form-group">
                    <label for="category">Category <span class="required-asterisk">*</span></label>
                    <select id="category" name="category" class="form-input budget-select" required>
                        <option value="" disabled {% if not category %}selected{% endif %}>Select category</option>
                        {% for cat in categories %}
                        <option value="{{ cat }}" {% if category == cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="amount">Budget Limit (₹) <span class="required-asterisk">*</span></label>
                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        class="form-input"
                        step="0.01"
                        min="0.01"
                        placeholder="0.00"
                        value="{{ amount }}"
                        required
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label for="month">Month <span class="required-asterisk">*</span></label>
                    <input
                        type="month"
                        id="month"
                        name="month"
                        class="form-input"
                        value="{{ month }}"
                        required
                    >
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary" id="submit-edit-budget">Save Changes</button>
                    <a href="{{ url_for('budgets', month=budget.month) }}" class="btn-ghost" id="cancel-edit-budget">Cancel</a>
                </div>

            </form>
        </div>

    </div>
</section>
{% endblock %}
